name: parallel-scan
on:
  push:
    branches: [scan]
  workflow_dispatch:
    inputs:
      range_start:
        description: 'Start of search range'
        required: false
        default: '1011128158584751'
      range_end:
        description: 'End of search range'
        required: false
        default: '10098097238186292'
      chunk_size:
        description: 'Positions per parallel chunk (e.g. 2000000000000 = 2e12)'
        required: false
        default: '2000000000000'
      max_chunks:
        description: 'Max number of parallel chunks (<=256)'
        required: false
        default: '24'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          python3 - <<'PYEOF'
          import json, os
          cfg = {}
          try:
              with open('scan_config.json') as fh: cfg = json.load(fh)
              print("using scan_config.json:", cfg)
          except Exception:
              print("no scan_config.json, using inputs/defaults")
          L = int(cfg.get('range_start', '${{ inputs.range_start || '1011128158584751' }}'))
          R = int(cfg.get('range_end', '${{ inputs.range_end || '10098097238186292' }}'))
          cs = int(cfg.get('chunk_size', '${{ inputs.chunk_size || '2000000000000' }}'))
          mc = int(cfg.get('max_chunks', '${{ inputs.max_chunks || '24' }}'))
          total = R - L + 1
          n = min(mc, (total + cs - 1)//cs)
          chunks = []
          for i in range(n):
              s = L + i*cs
              e = min(L + (i+1)*cs - 1, R)
              chunks.append({"i": i, "s": str(s), "e": str(e)})
          with open('matrix.json','w') as f: json.dump({"include": chunks}, f)
          mj = json.dumps({'include': chunks})
          print(f"nchunks={n}")
          print(f"matrix={mj}")
          # set step output for the matrix strategy
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("matrix=" + mj + "\n")
          PYEOF
      - name: Report plan
        run: |
          echo "Range [${{ inputs.range_start }}, ${{ inputs.range_end }}]"
          echo "chunk_size=${{ inputs.chunk_size }}, max_chunks=${{ inputs.max_chunks }}"

  scan:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: g++ -O3 -march=native -funroll-loops -pthread -o scan_range scan_range.cpp
      - name: Scan chunk ${{ matrix.i }}
        timeout-minutes: 350
        run: |
          timeout 345m ./scan_range "${{ matrix.s }}" "${{ matrix.e }}" 20000000 > chunk_${{ matrix.i }}.txt 2>&1
          echo "exit=$?" >> chunk_${{ matrix.i }}.txt
      - name: Summarize
        run: |
          if grep -q "FOUND N" chunk_${{ matrix.i }}.txt; then
            echo "CHUNK_${{ matrix.i }} [${{ matrix.s }}, ${{ matrix.e }}]: SOLUTION FOUND"
            grep "FOUND N" chunk_${{ matrix.i }}.txt
          elif grep -q "NO SOLUTION" chunk_${{ matrix.i }}.txt; then
            echo "CHUNK_${{ matrix.i }} [${{ matrix.s }}, ${{ matrix.e }}]: no solution"
          else
            echo "CHUNK_${{ matrix.i }} [${{ matrix.s }}, ${{ matrix.e }}]: TIMEOUT/partial"
            tail -1 chunk_${{ matrix.i }}.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.i }}
          path: chunk_${{ matrix.i }}.txt

  collect:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate and commit
        run: |
          set -e
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p /tmp/rs/$TS
          : > /tmp/rs/$TS/summary.txt
          sols=0
          for f in artifacts/chunk-*/chunk_*.txt; do
            cid=$(basename "$f" .txt)
            if grep -q "FOUND N" "$f"; then
              echo "$cid: SOLUTION -> $(grep 'FOUND N' "$f" | head -1)" >> /tmp/rs/$TS/summary.txt
              sols=1
            elif grep -q "NO SOLUTION" "$f"; then
              echo "$cid: no-solution" >> /tmp/rs/$TS/summary.txt
            else
              echo "$cid: TIMEOUT/partial" >> /tmp/rs/$TS/summary.txt
            fi
          done
          echo "ANY_SOLUTION=$sols" >> /tmp/rs/$TS/summary.txt
          echo "=== run $TS ==="; cat /tmp/rs/$TS/summary.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin results || true
          if git rev-parse --verify origin/results >/dev/null 2>&1; then
            git checkout -B results origin/results
          else
            git checkout -B results
          fi
          mkdir -p results
          cp -r /tmp/rs/* results/
          git add results/
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -m "scan results $TS" || echo "no changes"
          git push -f origin results